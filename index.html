body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",Roboto,sans-serif;line-height:1.5;font-size:16px}

.stars button.on{color:var(--st)}

textarea{width:100%;min-height:96px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
.btn{display:block;width:100%;text-align:center;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin-top:10px}
.btn.alt{background:var(--chip);color:var(--tx);border:1px solid var(--bd);font-weight:600}
.btn:disabled{opacity:.6}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.note{color:var(--mu);font-size:.85rem;margin:10px 0 0}
.msg{color:var(--ac);font-weight:600;margin:8px 0 0}
